[org/gnome/desktop/interface]
accent-color='blue'
color-scheme='prefer-dark'
cursor-size=24
cursor-theme='MacTheme-cursors'
gtk-theme='MacTheme-Dark'
icon-theme='MacTheme-blue-dark'
show-battery-percentage=true

[org/gnome/desktop/wm/preferences]
action-double-click-titlebar='toggle-maximize'
action-middle-click-titlebar='lower'
action-right-click-titlebar='menu'
button-layout='close,minimize,maximize:'
focus-mode='click'
mouse-button-modifier='<Alt>'
resize-with-right-button=true
theme='MacTheme-Dark'

[org/gnome/shell/keybindings]
show-screenshot-ui=['Print', '<Shift><Super>s']

[org/gnome/shell/extensions/user-theme]
name='MacTheme-Dark'

[org/gnome/shell/extensions/ubuntutahoe]
clock-offset=20
clock-position=1
enable-blur=true
enable-globalmenu=true
enable-kimpanel=false
enabled=true
hide-activities=true

[org/gnome/shell/extensions/ubuntutahoedock]
animation-time=0.1
background-opacity=0.0
click-action='minimize'
custom-theme-shrink=false
dash-max-icon-size=80
show-delay=0.0
show-trash=false

[org/gnome/shell/extensions/ubuntutahoeclipboard]
history-size=20
toggle-menu=['<Super><Alt>space']

[org/gnome/shell/extensions/ubuntutahoespotlight]
max-results=8
toggle-spotlight=['<Super><Alt>f']

[org/gnome/shell/extensions/blur-my-shell]
brightness=0.6
settings-version=7
sigma=30

[org/gnome/shell/extensions/blur-my-shell/appfolder]
blur=true

[org/gnome/shell/extensions/blur-my-shell/overview]
blur=true

[org/gnome/shell/extensions/blur-my-shell/panel]
blur=false
override-background=true
override-background-dynamically=false
style-panel=0

[org/gnome/shell/extensions/globalmenu]
custom-menus='[]'
desktop-app-name='Files'
hide-overview-button=true
logo-custom-icon-path=''
logo-distro-icon=''
logo-distro-icon-symbolic=true
logo-icon-name='start-here-symbolic'
logo-icon-size=16
menu-app-enabled=true
menu-edit-enabled=true
menu-file-enabled=true
menu-go-enabled=true
menu-help-enabled=true
menu-view-enabled=true
menu-window-enabled=true
show-indicator=true
show-logo-menu=true
system-menu-custom-items='[]'
