# Builds the 20px Qt title-bar plugin for each distro's Qt, then publishes the
# release archive that bootstrap.sh downloads. Run it by hand to test the builds.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qt-plugin:
    name: Qt plugin (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            deps: pacman -Syu --noconfirm --needed git cmake make gcc qt6-base qt6-svg qt6-wayland
          - image: fedora:latest
            deps: >-
              dnf install -y git findutils cmake make gcc-c++ qt6-qtbase-devel
              qt6-qtbase-private-devel qt6-qtsvg-devel qt6-qtwayland-devel
          - image: debian:stable
            deps: >-
              apt-get update && apt-get install -y --no-install-recommends ca-certificates
              git cmake make g++ qt6-base-dev qt6-base-private-dev qt6-svg-dev
              qt6-wayland-dev qt6-wayland-private-dev
          - image: ubuntu:rolling
            deps: >-
              apt-get update && apt-get install -y --no-install-recommends ca-certificates
              git cmake make g++ qt6-base-dev qt6-base-private-dev qt6-svg-dev
              qt6-wayland-dev qt6-wayland-private-dev
    steps:
      - run: ${{ matrix.deps }}
        env:
          DEBIAN_FRONTEND: noninteractive
      - uses: actions/checkout@v4
      - run: qt/build-decoration.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qt-plugin-${{ strategy.job-index }}
          path: qt/wayland-decoration-client

  qt-plugin-flatpak:
    name: Qt plugin (KDE Flatpak ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['6.10', '6.11']
    steps:
      - uses: actions/checkout@v4
      - name: Build in the KDE SDK
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Sdk//${{ matrix.sdk }}
          flatpak run --share=network --filesystem="$PWD" --command=bash org.kde.Sdk//${{ matrix.sdk }} qt/build-decoration.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qt-plugin-flatpak-${{ matrix.sdk }}
          path: qt/wayland-decoration-client

  release:
    needs: [qt-plugin, qt-plugin-flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qt-plugin-*
          merge-multiple: true
          path: qt/wayland-decoration-client
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --prefix=gnome-theme/ -o gnome-theme.tar HEAD
          tar --transform 's,^,gnome-theme/,' -rf gnome-theme.tar qt/wayland-decoration-client
          gzip gnome-theme.tar
          tar -tzf gnome-theme.tar.gz | grep libqwhitesurgtkdecorations.so
          gh release create "$GITHUB_REF_NAME" gnome-theme.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
